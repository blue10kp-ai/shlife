<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e8c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="신한FC m">
  <title>신한FC m</title>
  <link rel="manifest" href="manifest.webmanifest?v=6">
  <link rel="icon" href="favicon.png?v=3" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
  <link rel="stylesheet" href="style.css?v=145">
  <link rel="stylesheet" href="tokens.css?v=117">
  <link rel="stylesheet" href="design.css?v=249">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="back-btn" hidden aria-label="뒤로 가기"><span class="chev-l">‹</span><span id="backLabel">고객 정보</span></button>
    <div class="tb-title"><h1 id="title">고객</h1></div>
    <form id="topSearch" class="top-search" hidden role="search">
      <input id="q" type="search" placeholder="고객 검색" autocomplete="off" enterkeyhint="search" aria-label="고객 검색 (이름·연락처·주소·미팅장소)">
      <button type="button" class="mic-btn top-mic" id="topMic" aria-label="음성으로 검색"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <ul id="recentList" class="recent" hidden></ul>
    </form>
    <button id="reloadBtn" class="text-btn icon-btn" hidden aria-label="새로고침" title="새로고침"><svg class="reload-ico" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button id="logoutBtn" class="text-btn icon-btn" hidden aria-label="로그아웃" title="로그아웃"><svg class="power-ico" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button>
  </header>

  <main>
    <!-- 로그인 화면 -->
    <section id="loginView" class="view" hidden>
      <div class="card center">
        <p class="lead"><b>신한FC m</b><br>Google Drive의 고객 정보를 찾아 보여줍니다.</p>
        <button id="loginBtn" class="primary big">Google 계정으로 로그인</button>
        <p><button id="loginOtherBtn" type="button" class="link-btn" hidden>다른 계정으로 로그인</button></p>
        <p class="hint">고객 정보는 Google Drive에서 바로 읽어 오며, 이 앱이나 GitHub에는 저장되지 않습니다.</p>
      </div>
    </section>

    <!-- 일정 화면 -->
    <section id="scheduleView" class="view" hidden></section>

    <!-- 고객 검색 화면 -->
    <section id="searchView" class="view" hidden>

      <p id="scopeHint" class="hint"></p>
      <!-- 고객 FC 선택: 전체 / 각 FC (기본은 내 FC) -->
      <div id="fcOpts" class="sopts fc-opts" role="group" aria-label="고객 FC" hidden></div>
      <!-- 검색 결과가 없을 때(처음 들어왔을 때 포함) 화면 안 검색창 -->
      <form id="pageSearch" class="card page-search" role="search">
        <p class="hint">고객 이름·연락처·주소·미팅장소·증권번호로 검색하세요.</p>
        <div class="search">
          <input id="q2" type="search" placeholder="고객 검색" autocomplete="off" enterkeyhint="search" aria-label="고객 검색">
          <button type="button" class="mic-btn page-mic" id="pageMic" aria-label="음성으로 검색"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <button class="primary" type="submit">검색</button>
        </div>
      </form>
      <div id="searchOpts" class="sopts" role="group" aria-label="고객 범위"><button type="button" data-opt="all" class="on">전체</button><button type="button" data-opt="contract">본인</button><button type="button" data-opt="transfer">이관</button><button type="button" data-opt="db">DB</button><button type="button" data-opt="plan">가망</button><button type="button" id="gradeOpt" aria-label="성향 Good"><span class="gl gl-Good on">G</span><span class="gl gl-Bad">B</span><span class="gl gl-Shit">S</span></button></div>
      <p id="searchStatus" class="hint"></p>
      <ul id="results" class="list"></ul>
      <p class="data-stamp"></p>
    </section>

    <!-- 고객 상세 화면 -->
    <section id="customerView" class="view" hidden>
      <div class="cust-bar"><button type="button" id="editBtn" class="edit-mini">수정</button><button type="button" id="closeCust" class="edit-mini">닫기</button><span id="editBtns" class="edit-btns" hidden><button type="button" id="editCancel" class="edit-mini">취소</button><button type="button" id="editSave" class="edit-mini on">확인</button></span></div>
      <div class="card cust-card">
        <div class="cust-head">
          <div class="avatar" id="avatar"></div>
          <div class="cust-main">
            <div class="name-row"><h2 id="custName"></h2><span id="custChurn" class="tag" hidden></span></div>
            <div id="custSub" class="cust-sub"></div>
          </div>
        </div>
        <div id="custTel" class="cust-tel" hidden></div>
        <div id="custNote" class="cust-note" hidden></div>
        <div id="photoMenu" class="photo-menu" hidden>
          <button type="button" id="photoPick">사진 바꾸기</button>
          <button type="button" id="photoDel" class="danger">사진 삭제</button>
          <button type="button" id="photoMenuClose">취소</button>
        </div>
        <div id="gradeBtns" class="grade-btns" hidden></div>
        <input type="file" id="photoInput" accept="image/*" hidden>
      </div>
      <nav id="tabs" class="tabs"></nav>
      <div id="tabBody"></div>
    </section>

    <!-- 관리자 화면 (관리자 아이디만) -->
    <!-- 영업 화면 (이달 이관·이달 따행) -->
    <section id="salesView" class="view" hidden></section>

    <section id="adminView" class="view" hidden>
      <div id="adminBody"></div>
      <p class="data-stamp"></p>
    </section>
  </main>


  <!-- 큰 메뉴 -->
  <!-- 관리자·설정 화면의 저장·취소 (하나로 합쳐 아래 메뉴 바로 위에 떠 있음) -->
  <div id="floatSave" class="float-save" hidden><button type="button" class="secondary" id="fsHelp">설명서</button><button type="button" class="secondary" id="fsCancel" disabled>취소</button><button type="button" class="primary" id="fsSave" disabled>저장</button></div>
  <nav id="mainNav" class="mainnav" hidden>
    <button type="button" id="navAi" class="nav-ai" aria-label="AI" aria-expanded="false"><span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8 L19 5.4 V11.2 C19 15.6 16.1 18.6 12 20.4 C7.9 18.6 5 15.6 5 11.2 V5.4 Z"/><path d="M8.4 13.6 L11 11 L13 12.8 L16.2 9.4"/><path d="M13.9 9.4 H16.2 V11.7"/></svg></span></button>
    <button type="button" data-section="schedule"><span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>일정</button>
    <button type="button" data-section="customer"><span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>고객</button>
    <button type="button" data-section="sales"><span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2M2 13h20"/></svg></span>영업</button>
    <button type="button" data-section="admin" id="navAdmin" hidden><span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg></span><span id="navAdminLabel">설정</span></button>
  </nav>

  <!-- AI 도우미: 아래에서 올라오는 창 (하단 메뉴 맨 왼쪽 아이콘으로 열고 닫음) -->
  <div id="aiScrim" class="ai-scrim" hidden></div>
  <section id="aiSheet" class="ai-sheet" hidden role="dialog" aria-label="AI 도우미">
    <div id="aiHead" class="ai-head">
      <div class="ai-grab" aria-hidden="true"></div>
    </div>
    <div class="ai-body">
      <p class="ai-q">무엇을 도와드릴까요?</p>
      <button type="button" id="aiMic" class="ai-mic" aria-label="말로 입력"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <p class="ai-st">눌러서 말씀하세요</p>
      <form id="aiForm" class="ai-form"><input id="aiInp" type="text" placeholder="말하거나 입력하세요" autocomplete="off" enterkeyhint="send" aria-label="AI 도우미에게 말하기"><button type="submit">보내기</button></form>
      <div class="ai-chips" id="aiChips"><button type="button">홍길동 검색</button><button type="button">내일 오후 3시 홍길동 상담 일정 추가</button></div>
      <div id="aiConfirm" class="ai-confirm" hidden></div>
      <p id="aiMsg" class="ai-msg" hidden></p>
    </div>
  </section>

  <!-- 프로필 사진 자르기 (원 안에 맞추기) -->
  <div id="cropModal" class="modal" hidden>
    <div class="modal-box">
      <h3 class="sec-title">사진 위치·크기 맞추기</h3>
      <p class="hint">사진을 끌어서 옮기고, 아래 막대(또는 두 손가락)로 크기를 조절하세요.</p>
      <div id="cropView" class="crop-view"><img id="cropImg" alt="" draggable="false"></div>
      <input id="cropZoom" type="range" min="1" max="4" step="0.01" value="1" aria-label="사진 크기">
      <div class="file-actions">
        <button type="button" class="secondary" id="cropCancel">취소</button>
        <button type="button" class="primary" id="cropOk">적용</button>
      </div>
    </div>
  </div>

  <!-- 사진 크게 보기 -->
  <div id="photoViewer" class="viewer" hidden><img id="photoViewerImg" alt="고객 사진"></div>

  <div id="toast" class="toast" hidden></div>

  <script async src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="config.js?v=118"></script>
  <script src="app.js?v=257"></script>
</body>
</html>

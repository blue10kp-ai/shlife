<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e8c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="고객찾기">
  <title>고객 찾기</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" hidden aria-label="뒤로">‹</button>
    <h1 id="title">고객 찾기</h1>
    <button id="logoutBtn" class="text-btn" hidden>로그아웃</button>
  </header>

  <main>
    <!-- 로그인 화면 -->
    <section id="loginView" class="view" hidden>
      <div class="card center">
        <p class="lead">내 OneDrive의 <b>Claude/고객</b> 폴더에서<br>고객 정보를 찾아 보여줍니다.</p>
        <button id="loginBtn" class="primary big">Microsoft 계정으로 로그인</button>
        <p class="hint">고객 정보는 OneDrive에서 바로 읽어 오며, 이 앱이나 GitHub에는 저장되지 않습니다.</p>
      </div>
    </section>

    <!-- 검색 화면 -->
    <section id="searchView" class="view" hidden>
      <form id="searchForm" class="search">
        <input id="q" type="search" placeholder="고객명 입력" autocomplete="off" enterkeyhint="search">
        <button class="primary" type="submit">검색</button>
      </form>
      <div id="modes" class="modes" role="group" aria-label="검색 범위">
        <button type="button" data-mode="all" class="on">전체</button>
        <button type="button" data-mode="contract">계약</button>
        <button type="button" data-mode="transfer">이관</button>
      </div>
      <p id="searchStatus" class="hint"></p>
      <ul id="results" class="list"></ul>
    </section>

    <!-- 고객 화면 -->
    <section id="customerView" class="view" hidden>
      <div class="card">
        <div class="cust-head">
          <div class="avatar" id="avatar"></div>
          <div>
            <h2 id="custName"></h2>
            <div id="custSub" class="hint"></div>
            <a id="folderLink" class="hint" target="_blank" rel="noopener">OneDrive에서 폴더 열기</a>
          </div>
        </div>
      </div>
      <nav id="tabs" class="tabs"></nav>
      <div id="tabBody"></div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="config.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>

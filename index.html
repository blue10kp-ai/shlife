<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e8c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="신한FC">
  <title>신한FC</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css?v=27">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="back-btn" hidden aria-label="뒤로 가기"><span class="chev-l">‹</span><span id="backLabel">고객 정보</span></button>
    <h1 id="title">고객</h1>
    <form id="topSearch" class="top-search" hidden role="search">
      <input id="q" type="search" placeholder="고객명 검색" autocomplete="off" enterkeyhint="search" aria-label="고객명 검색">
      <ul id="recentList" class="recent" hidden></ul>
    </form>
    <button id="logoutBtn" class="text-btn" hidden>로그아웃</button>
  </header>

  <main>
    <!-- 로그인 화면 -->
    <section id="loginView" class="view" hidden>
      <div class="card center">
        <p class="lead"><b>신한FC</b><br>OneDrive의 고객 정보를 찾아 보여줍니다.</p>
        <button id="loginBtn" class="primary big">Microsoft 계정으로 로그인</button>
        <p class="hint">고객 정보는 OneDrive에서 바로 읽어 오며, 이 앱이나 GitHub에는 저장되지 않습니다.</p>
      </div>
    </section>

    <!-- 일정 화면 -->
    <section id="scheduleView" class="view" hidden>
      <div class="card center">
        <p class="lead">일정 메뉴는 준비 중입니다.</p>
        <p class="hint">어떤 일정을 보여줄지 정해지면 이곳에 추가됩니다.</p>
      </div>
    </section>

    <!-- 고객 검색 화면 -->
    <section id="searchView" class="view" hidden>

      <div id="modes" class="modes" role="group" aria-label="검색 범위"></div>
      <p id="scopeHint" class="hint"></p>
      <p id="searchStatus" class="hint"></p>
      <ul id="results" class="list"></ul>
    </section>

    <!-- 고객 상세 화면 -->
    <section id="customerView" class="view" hidden>
      <div class="card">
        <div class="cust-head">
          <div class="avatar" id="avatar"></div>
          <div>
            <h2 id="custName"></h2>
            <div id="custSub" class="hint"></div>
          </div>
        </div>
      </div>
      <nav id="tabs" class="tabs"></nav>
      <div id="tabBody"></div>
    </section>

    <!-- 관리자 화면 (관리자 아이디만) -->
    <section id="adminView" class="view" hidden>
      <div id="adminBody"></div>
    </section>
  </main>

  <!-- 큰 메뉴 -->
  <nav id="mainNav" class="mainnav" hidden>
    <button type="button" data-section="schedule"><span class="ni">📅</span>일정</button>
    <button type="button" data-section="customer"><span class="ni">👤</span>고객</button>
    <button type="button" data-section="admin" id="navAdmin" hidden><span class="ni">⚙️</span>관리자</button>
  </nav>

  <!-- 프로필 사진 자르기 (원 안에 맞추기) -->
  <div id="cropModal" class="modal" hidden>
    <div class="modal-box">
      <h3 class="sec-title">사진 위치·크기 맞추기</h3>
      <p class="hint">사진을 끌어서 옮기고, 아래 막대(또는 두 손가락)로 크기를 조절하세요.</p>
      <div id="cropView" class="crop-view"><img id="cropImg" alt="" draggable="false"></div>
      <input id="cropZoom" type="range" min="1" max="4" step="0.01" value="1" aria-label="사진 크기">
      <div class="file-actions">
        <button type="button" class="secondary" id="cropCancel">취소</button>
        <button type="button" class="primary" id="cropOk">적용</button>
      </div>
    </div>
  </div>

  <!-- 사진 크게 보기 -->
  <div id="photoViewer" class="viewer" hidden><img id="photoViewerImg" alt="고객 사진"></div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="config.js?v=27"></script>
  <script src="app.js?v=27"></script>
</body>
</html>

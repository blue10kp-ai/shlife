<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171B22" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>차차차</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");
/* 신한FC m과 같은 디자인 기준(tokens.css·design.css)을 이 파일 안에 옮겨 둔 것. 신한FC 파일은 링크하지 않음 */
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--raised:#F0F2F5;--line:rgba(20,30,50,.10);
  --t1:#151A22;--t2:#4B5361;--t3:#6B7382;
  --accent:#1F4E8C;--accent-ink:#FFFFFF;--accent-weak:rgba(31,78,140,.08);
  --ok:#1D7A46;--warn:#A8620B;--bad:#C0392B;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --r-ctl:8px;--r-card:12px;--r-panel:16px;
  --ease:cubic-bezier(.2,.8,.2,1);--t-fast:120ms;--t-in:200ms;--navh:60px
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1217;--surface:#171B22;--raised:#1E232B;--line:rgba(255,255,255,.09);
  --t1:#E8EBF0;--t2:#A5ADBA;--t3:#747C8A;
  --accent:#7FAEF0;--accent-ink:#0F1217;--accent-weak:rgba(127,174,240,.12);
  --ok:#4CC282;--warn:#E0A04A;--bad:#EF7A6C}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html.lock{overflow:hidden;overscroll-behavior-y:contain}
html,body{font-family:var(--font);font-size:15px;line-height:1.5;background:var(--bg);color:var(--t1)}
body{margin:0;padding-bottom:calc(var(--navh) + 36px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:var(--font)}
button{color:inherit;cursor:pointer}
/* 상단 바: 색 없이 표면 + 헤어라인 */
header{position:sticky;top:0;z-index:5;background:var(--surface);color:var(--t1);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;min-height:56px;display:flex;align-items:center;font-size:17px;font-weight:600;cursor:pointer}
.wrap{padding:16px 16px 0;max-width:640px;margin:0 auto}
/* 차 고르기: 바탕 칸 안에서 선택만 흰색 */
.cars{display:flex;gap:2px;background:var(--raised);border-radius:var(--r-ctl);padding:2px;margin:12px 16px 0}
@media(min-width:672px){.cars{max-width:608px;margin:12px auto 0}}
.chip{flex:1;min-height:32px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--t2);font-size:13px;font-weight:500;white-space:nowrap}
.chip:last-child:not(.on){flex:0 0 40px}
.chip.on{background:var(--surface);color:var(--t1);box-shadow:0 0 0 1px var(--line)}
/* 카드: 얇은 테두리, 그림자 없음 */
.card{background:var(--surface);border:1px solid var(--line);box-shadow:none;border-radius:var(--r-card);padding:16px;margin-bottom:8px}
.card h3{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--t3)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;margin:0 0 8px}
.hero .ph{background:var(--raised);height:136px;display:flex;align-items:center;justify-content:center}
.hero .ph img{width:100%;height:100%;object-fit:cover}
.hero .ph svg{width:64%}
.hero .in{padding:14px 16px}
.hero h2{margin:0;font-size:19px;font-weight:600}
.sub{color:var(--t2);font-size:13px;line-height:1.45}
.k{color:var(--t3);font-size:12px}.v{font-weight:600}
.big{font-size:22px;font-weight:600;letter-spacing:-.2px}
.save{color:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{font-weight:500}.row .r{text-align:right;white-space:nowrap}
.l{display:flex;align-items:center;min-width:0}
.ic{flex:0 0 42px;height:24px;border-radius:6px;background:var(--raised);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--t2);margin-right:12px}
.empty{color:var(--t3);text-align:center;padding:20px 0;font-size:13px}
.note{font-size:13px;color:var(--t3);margin-top:8px}
.warn{border:1px solid var(--warn);border-left:3px solid var(--warn);background:var(--surface);color:var(--t1);border-radius:var(--r-card);padding:8px 10px;font-size:13px;margin-top:8px}
/* 버튼: 작은 윤곽 버튼, 주요 버튼은 강조색 테두리·글자 */
.btn{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;height:30px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);color:var(--t2);font-size:13px;font-weight:600;line-height:1;white-space:nowrap;transition:background-color var(--t-fast) var(--ease)}
.btn:active{background:var(--raised)}
.btn.pri{border-color:var(--accent);color:var(--accent)}
.btn.sm{height:24px;padding:0 9px;font-size:12px;font-weight:700;color:var(--accent)}
.btn.dng{color:var(--bad)}
.btn:disabled{opacity:.4}
.acts{display:flex;gap:8px;margin-top:12px}.acts .btn{flex:1}
/* 입력칸: 낮고 단정하게 */
label{display:block;font-size:13px;color:var(--t3);margin:12px 0 4px}
input,select,textarea{width:100%;height:32px;padding:0 10px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);color:var(--t1)}
textarea{height:auto;padding:8px 10px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=color]{padding:2px}
.inl{display:flex;gap:8px}.inl>*{flex:1;min-width:0}
/* 상태 표시: 색 알약 대신 점 + 글자 */
.badge{display:inline-flex;align-items:center;gap:6px;height:fit-content;background:none;padding:0;border-radius:0;font-size:12px;font-weight:500;color:var(--t2)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--t3);flex:none}
.badge.on::before{background:var(--ok)}
/* 하단 메뉴: 선 아이콘 + 글자, 선택은 위쪽 책갈피 선 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:0 8px max(0px,calc(env(safe-area-inset-bottom) - 10px))}
nav button{flex:1;min-height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;border-radius:0;background:none;position:relative;font-size:11px;font-weight:500;color:var(--t3)}
nav .ni{display:block;line-height:0}
nav .ni svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
nav button.on::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:2px;background:var(--accent);border-radius:0 0 2px 2px}
nav .aiico{width:26px;height:26px;border-radius:7px;background:var(--raised);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
nav .navai.on .aiico{outline:2px solid var(--accent);outline-offset:2px}
nav .navai.on::before{display:none}
/* 입력 창(시트) */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--t1);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:8px 16px 16px;animation:up var(--t-in) var(--ease)}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--t3);opacity:.5;margin:2px auto 12px}
.sheet h3{margin:0 0 4px;font-size:17px;font-weight:600}
/* AI 도우미: 아래에서 올라오는 창 + 끌기 막대 */
.scrim{position:fixed;inset:0;z-index:9;background:rgba(10,15,25,.45)}
.ai{overscroll-behavior:contain;position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));z-index:10;max-width:640px;margin:0 auto;max-height:calc(100vh - var(--navh) - 56px);overflow-y:auto;background:var(--surface);color:var(--t1);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:8px 16px 14px;text-align:center;display:flex;flex-direction:column;gap:10px;transition:transform var(--t-in) var(--ease);animation:up var(--t-in) var(--ease)}
.ai[hidden],.scrim[hidden]{display:none}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--t3);opacity:.5;margin:2px auto 8px;flex:none}
.aq{margin:6px 0 0;font-size:15px;color:var(--t2)}
.mic{width:76px;height:76px;min-height:0;padding:0;border:0;border-radius:50%;margin:0 auto;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 9px var(--accent-weak);flex:none}
.mic.rec{background:var(--bad);color:#fff;box-shadow:0 0 0 9px rgba(192,57,43,.15)}
.mic:disabled{opacity:.4}
.ast{margin:0;font-size:13px;color:var(--t3)}
.aform{display:flex;gap:8px}
.aform input{flex:1;min-width:0;height:42px;border:0;border-radius:var(--r-ctl);background:var(--raised);color:var(--t1);padding:0 12px;font-size:16px}
.aform input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.aform button{flex:none;width:64px;height:42px;min-height:0;border:0;border-radius:var(--r-ctl);background:var(--raised);color:var(--accent);font-size:14px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chips button{min-height:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12.5px;color:var(--t2)}
.msg{margin:0;padding:10px 12px;border-radius:var(--r-card);background:var(--accent-weak);color:var(--t1);font-size:13.5px;text-align:left;white-space:pre-line}
.pend{border:1px solid var(--line);border-radius:var(--r-card);padding:12px;text-align:left}
</style>
</head>
<body>
<header id="title">차차차</header>
<div class="cars" id="cars"></div>
<div class="wrap" id="main"></div>
<div id="scrim" class="scrim" hidden></div>
<section id="ai" class="ai" hidden role="dialog" aria-label="AI 도우미">
  <div class="grab"></div>
  <div class="aq">무엇을 도와드릴까요?</div>
  <button class="mic" id="mic" aria-label="말로 입력"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <div class="ast" id="ast">눌러서 말해 보세요</div>
  <form class="aform" id="aform"><input id="atxt" placeholder="직접 입력해도 돼요" autocomplete="off"><button type="submit">보내기</button></form>
  <div class="chips" id="achips"></div>
  <div id="aout"></div>
</section>
<nav id="nav"></nav>
<div id="modal"></div>

<script>
"use strict";
const KEY="chachacha.v1",OLDKEYS=["teslaChagyebu.v1","teslaGagyeok.v1"]; // 옛 이름으로 저장된 기록은 읽어서 새 키로 옮김
const COMPS=[["BMW 5시리즈 528i 가솔린",11.0],["BMW 5시리즈 520i 가솔린",11.5],["직접 입력",11.0]];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const won=n=>(Math.round(n)||0).toLocaleString("ko-KR")+"원";
const num=n=>Math.round(n).toLocaleString("ko-KR");
const fuelDef=()=>({comp:COMPS[0][0],kmL:11.0,price:1840,kmkWh:5.0,kwh:319});

function seed(){
  const a=uid(),b=uid(),t1=uid(),t2=uid(),t3=uid(),t4=uid();
  return{sel:a,cars:[
    {id:a,nick:"하양이",model:"Tesla Model 3",trim:"Long Range",year:2020,color:"흰색",colorHex:"#f1f1f1",wheel:"19인치 정품",delivered:"2020-06-30",tireSpec:"235/40R19",tireAlt:"245/40R19",photo:"",startKm:0,fuel:fuelDef(),
     odo:[{id:uid(),date:"2026-11-12",km:205488}],maint:[],
     tires:[{id:t2,brand:"미쉐린 PA4",type:"윈터",size:"235/40R19",bought:"2025-11-01",price:"",note:""}],
     mounts:[{id:uid(),tireId:t2,date:"2025-11-01",km:null}]},
    {id:b,nick:"빨강이",model:"Tesla Model 3 Highland",trim:"Long Range",year:2024,color:"울트라 레드",colorHex:"#c4262e",wheel:"19인치 정품",delivered:"2024-03-16",tireSpec:"235/40R19",tireAlt:"245/40R19",photo:"",startKm:0,fuel:fuelDef(),
     odo:[],maint:[],
     tires:[{id:t3,brand:"출고 기본 타이어",type:"기본",size:"235/40R19",bought:"2024-03-16",price:"",note:"30km 주행 후 보관 중"},
            {id:t1,brand:"넥센 엔페라 슈프림 EV",type:"사계절",size:"235/40R19",bought:"2024-03-16",price:"",note:"출고 때부터 교체해 사용 (확인 필요)"},
            {id:t4,brand:"한국타이어 윈터",type:"윈터",size:"",bought:"2025-11-25",price:"",note:"보관 중 · 어느 차에 썼는지·규격·지난 시즌 거리 확인 필요"}],
     mounts:[{id:uid(),tireId:t3,date:"2024-03-16",km:0},{id:uid(),tireId:t1,date:"2024-03-16",km:30}]}
  ]};
}
let db;
try{let raw=localStorage.getItem(KEY);if(!raw){for(const k of OLDKEYS){raw=localStorage.getItem(k);if(raw)break}}db=JSON.parse(raw)}catch(e){}
if(!db||!db.cars||!db.cars.length)db=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("저장 공간이 부족합니다. 사진을 줄이거나 백업 후 정리해 주세요.")}};
try{if(!localStorage.getItem(KEY))save()}catch(e){}
let view="home";
const car=()=>db.cars.find(c=>c.id===db.sel)||db.cars[0];
const lastKm=c=>c.odo.length?Math.max(...c.odo.map(o=>o.km)):null;
const lastOdo=c=>c.odo.length?c.odo.reduce((a,b)=>b.km>=a.km?b:a):null;

function carSvg(hex){return`<svg viewBox="0 0 400 140" xmlns="http://www.w3.org/2000/svg"><ellipse cx="200" cy="124" rx="165" ry="8" fill="#000" opacity=".07"/><path d="M30 100c0-14 6-22 22-26l60-14c18-16 44-26 76-26 40 0 66 12 88 32l58 10c14 3 22 12 22 24v6c0 5-4 8-9 8h-20a32 32 0 0 0-64 0H146a32 32 0 0 0-64 0H40c-6 0-10-4-10-8z" fill="${hex}" stroke="#9aa0a6" stroke-width="2"/><path d="M128 62c14-12 36-20 62-20 30 0 52 8 70 24z" fill="#dfe6ec" stroke="#9aa0a6" stroke-width="1.5"/><circle cx="114" cy="108" r="24" fill="#2b2f33"/><circle cx="114" cy="108" r="11" fill="#c9ced3"/><circle cx="296" cy="108" r="24" fill="#2b2f33"/><circle cx="296" cy="108" r="11" fill="#c9ced3"/></svg>`}

/* ---------- 계산 ---------- */
function monthsSince(d){if(!d)return null;const a=new Date(d),b=new Date();let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;return Math.max(m,0)}
function ageText(d){const m=monthsSince(d);if(m===null)return"–";const y=Math.floor(m/12),r=m%12;return(y?y+"년 ":"")+r+"개월"}
function fuelCalc(c){const top=lastKm(c);if(top===null)return null;const km=Math.max(top-(+c.startKm||0),0),f=c.fuel,gas=km/f.kmL*f.price,ev=km/f.kmkWh*f.kwh;return{km,gas,ev,save:gas-ev,perKm:(gas-ev)/(km||1)}}
function tireStats(c,tid){
  const ms=c.mounts.map((m,i)=>({...m,i})).sort((a,b)=>a.date.localeCompare(b.date)||a.i-b.i);
  const cur=lastKm(c);let dist=0,unknown=false;
  ms.forEach((m,i)=>{if(m.tireId!==tid)return;const end=ms[i+1]?ms[i+1].km:cur;if(m.km==null||end==null){unknown=true;return}dist+=Math.max(end-m.km,0)});
  const last=ms[ms.length-1];
  return{dist,unknown,mounted:!!last&&last.tireId===tid,count:ms.filter(m=>m.tireId===tid).length};
}
const mountedTire=c=>c.tires.find(t=>tireStats(c,t.id).mounted);

/* ---------- 화면 ---------- */
function render(){
  $("#cars").innerHTML=db.cars.map(c=>`<button class="chip ${c.id===db.sel?"on":""}" data-act="sel" data-id="${c.id}">${esc(c.nick)}</button>`).join("")+`<button class="chip" data-act="addCar">＋</button>`;
  const T=[["trip","주행"],["maint","정비"],["tire","타이어"]];
  const IC={trip:'<path d="M3.3 17a9 9 0 1 1 17.4 0"/><path d="M12 14l4-5"/><circle cx="12" cy="14" r="1"/>',maint:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',tire:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/>'};
  $("#nav").innerHTML=`<button class="navai ${aiIsOpen?"on":""}" data-act="ai" aria-label="AI" aria-expanded="${aiIsOpen}"><span class="ni"><span class="aiico">✨</span></span>AI</button>`+T.map(([k,l])=>`<button class="${view===k?"on":""}" data-act="view" data-id="${k}"><span class="ni"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg></span>${l}</button>`).join("");
  const c=car();
  $("#main").innerHTML=({home:vHome,trip:vTrip,maint:vMaint,tire:vTire}[view])(c);
}
function hero(c,withInfo){
  return`<div class="hero"><div class="ph">${c.photo?`<img src="${c.photo}" alt="">`:carSvg(c.colorHex)}</div><div class="in"><h2>${esc(c.nick)}</h2><div class="sub">${c.year}년식 ${esc(c.model)} ${esc(c.trim)} · ${esc(c.color)} · ${esc(c.wheel)}</div><div class="sub">인도 ${esc(c.delivered)} · ${ageText(c.delivered)} · 타이어 ${esc(c.tireSpec)}${c.tireAlt?" (호환 "+esc(c.tireAlt)+")":""}</div></div></div>`;
}
function events(c){
  const ev=[];
  c.odo.forEach(o=>ev.push({d:o.date,ic:"주행",t:num(o.km)+" km"}));
  c.maint.forEach(m=>ev.push({d:m.date,ic:"정비",t:m.item,r:won(m.amount)}));
  c.mounts.forEach(m=>{const t=c.tires.find(x=>x.id===m.tireId);if(t)ev.push({d:m.date,ic:"타이어",t:t.brand+" 장착"})});
  return ev.sort((a,b)=>b.d.localeCompare(a.d));
}
function vHome(c){
  const k=lastKm(c),lo=lastOdo(c),fc=fuelCalc(c),ev=events(c).slice(0,6);

function vTrip(c){

  else h+=`<div class="card"><h3>아낀 연료비</h3><div class="sub">누적 km를 입력하면 계산돼요</div></div>`;

  h+=`<div class="card"><h3>주행 기록</h3>`;
  if(!desc.length)h+=`<div class="empty">기록이 없습니다</div>`;
  desc.forEach(o=>{const i=asc.indexOf(o),d=i>0?o.km-asc[i-1].km:null;h+=`<div class="row"><div><div class="t">${num(o.km)} km</div><div class="sub">${esc(o.date)}${d!==null?" · +"+num(d)+" km":""}</div></div><button class="btn sm dng" data-act="delOdo" data-id="${o.id}">삭제</button></div>`});
  return h+`</div>`;
}

function vTire(c){

    ${t.price?`<div class="sub" style="margin-top:6px">구입가 ${esc(t.price)}</div>`:""}${t.note?`<div class="sub">${esc(t.note)}</div>`:""}

  const ms=c.mounts.map((m,i)=>({...m,i})).sort((a,b)=>b.date.localeCompare(a.date)||b.i-a.i);
  h+=`<div class="card"><h3>장착 이력</h3>`;
  if(!ms.length)h+=`<div class="empty">이력이 없습니다</div>`;

  return h+`</div>`;

function form(title,fields,onSave,extra){
  const f=fields.map(x=>{const v=x.v??"";
    if(x.t==="select")return`<label>${x.l}</label><select data-k="${x.k}">${x.o.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    if(x.t==="area")return`<label>${x.l}</label><textarea rows="2" data-k="${x.k}">${esc(v)}</textarea>`;
    return`<label>${x.l}</label><input data-k="${x.k}" type="${x.t||"text"}" ${x.t==="number"?'inputmode="decimal" step="any"':""} value="${esc(v)}" ${x.p?`placeholder="${esc(x.p)}"`:""}>`}).join("");
  $("#modal").innerHTML=`<div class="modal" data-act="mclose"><div class="sheet"><h3>${title}</h3>${extra||""}${f}<div class="acts"><button class="btn" data-act="mclose">취소</button><button class="btn pri" id="mok">저장</button></div></div></div>`;
  $("#mok").onclick=()=>{const o={};document.querySelectorAll("#modal [data-k]").forEach(e=>o[e.dataset.k]=e.value.trim());if(onSave(o)!==false){$("#modal").innerHTML="";render()}};
}

/* ---------- AI 도우미 (정해진 말투를 알아듣는 방식) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,pending=null;
const CHIPS=["하양이 205,500km 탔어","빨강이 에어컨 필터 교체 48,000원","하양이 아낀 연료비는?","하양이 타이어 몇 km 탔어?"];
var aiIsOpen=false,aiClosing=null,aiHist=false,aiExpectPop=false;
function aiFinish(){ // 내려가는 애니메이션이 끝나면 완전히 숨김
  if(!aiClosing)return;
  clearTimeout(aiClosing);aiClosing=null;
  const sh=$("#ai");$("#scrim").hidden=true;sh.hidden=true;sh.style.transform="";sh.style.transition="";
  document.documentElement.classList.remove("lock");$("#aout").innerHTML="";$("#atxt").value="";pending=null;
}
function aiOpen(){
  if(aiIsOpen)return;aiFinish();aiIsOpen=true;
  $("#scrim").hidden=false;$("#ai").hidden=false;$("#ai").style.transform="";document.documentElement.classList.add("lock");
  $("#achips").innerHTML=CHIPS.map(t=>`<button type="button" data-act="chip">${esc(t)}</button>`).join("");
  if(!SR){$("#mic").disabled=true;$("#ast").textContent="이 브라우저는 말하기를 지원하지 않아요. 글로 입력하세요"}
  render();
  history.pushState({v:"ai"},"");aiHist=true; // 폰 뒤로가기로 닫을 수 있게 기록 한 칸 쌓기
}
// 닫기: 끌기·✨ 다시 누르기·바깥·Esc·뒤로가기 모두 같은 방식(항상 아래로 내려감)
function aiClose(fromPop){
  if(!aiIsOpen)return;aiIsOpen=false;stopRec();
  const sh=$("#ai");sh.style.transition="transform 200ms ease-out";sh.style.transform="translateY(100%)";
  aiClosing=setTimeout(aiFinish,220);render();
  if(aiHist){aiHist=false;if(fromPop!=="pop"){aiExpectPop=true;history.back()}}
}
window.addEventListener("popstate",()=>{
  if(aiExpectPop){aiExpectPop=false;return}
  if(aiIsOpen)aiClose("pop");
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&aiIsOpen)aiClose()});
{ // 창 안 어디를 잡고 아래로 8px 넘게 끌면 끌기 시작, 80px 넘으면 닫힘 (입력칸은 제외, 맨 위가 아닐 땐 스크롤 우선)
  const sh=$("#ai");let y0=null,dy=0,drag=false,mouse=false;
  const begin=(y,t,m)=>{if(t&&t.closest&&t.closest("input"))return;y0=y;dy=0;drag=false;mouse=m};
  const move=(y,ev)=>{if(y0===null)return;const d=y-y0;
    if(!drag){if(d>8&&sh.scrollTop<=0){drag=true;sh.style.transition="none"}else if(d<-8||sh.scrollTop>0){y0=null;return}else return}
    dy=Math.max(0,d);sh.style.transform="translateY("+dy+"px)";if(ev&&ev.cancelable)ev.preventDefault()};
  const end=()=>{if(y0===null)return;const was=drag;y0=null;drag=false;sh.style.transition="";if(!was)return;if(dy>80)aiClose();else sh.style.transform=""};
  sh.addEventListener("touchstart",e=>begin(e.touches[0].clientY,e.target,false),{passive:true});
  sh.addEventListener("touchmove",e=>move(e.touches[0].clientY,e),{passive:false});
  sh.addEventListener("touchend",end);sh.addEventListener("touchcancel",end);
  sh.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse")begin(e.clientY,e.target,true)});
  window.addEventListener("pointermove",e=>{if(mouse)move(e.clientY,null)});
  window.addEventListener("pointerup",()=>{if(mouse){end();mouse=false}});
}
function stopRec(){try{rec&&rec.stop()}catch(e){}rec=null;$("#mic").classList.remove("rec")}
function koNum(seg){let t=0,m;const re=/(\d+(?:\.\d+)?)\s*([억만천백])?/g,U={"억":1e8,"만":1e4,"천":1e3,"백":100};while((m=re.exec(seg)))t+=parseFloat(m[1])*(U[m[2]]||1);return Math.round(t)}
function parseText(raw){
  const t=raw.replace(/,/g,"");
  const mk=t.match(/((?:\d+(?:\.\d+)?\s*[만천백]?\s*)+)\s*(?:km|㎞|킬로미터|킬로|키로)/i);
  const mw=t.match(/((?:\d+(?:\.\d+)?\s*[억만천백]?\s*)+)\s*원/);
  let date=today();
  const dm=t.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if(dm)date=new Date().getFullYear()+"-"+dm[1].padStart(2,"0")+"-"+dm[2].padStart(2,"0");
  else if(/그저께|그제/.test(t))date=daysAgo(2);else if(/어제/.test(t))date=daysAgo(1);
  const syn={"흰":["흰","하양","화이트"],"빨":["빨","레드","하이랜드"],"검":["검","블랙"],"회":["회","그레이"],"파":["파란","파랑","블루"]};
  let target=null;
  for(const c of db.cars){const keys=[c.nick,...(syn[c.color[0]]||[c.color[0]])].filter(Boolean);if(keys.some(k=>t.includes(k))){target=c;break}}
  return{t,km:mk?koNum(mk[1]):null,won:mw?koNum(mw[1]):null,date,car:target||car(),guessed:!target,kmStr:mk&&mk[0],wonStr:mw&&mw[0],dateStr:dm&&dm[0]};
}
function itemName(p){
  let s=p.t.replace(p.kmStr||"","").replace(p.wonStr||"","").replace(p.dateStr||"","");
  s=s.replace(/(했어요|했어|했다|했음|해서|하고)(?=\s|$)/g," ").replace(/(^|\s)(흰색|빨간|흰|빨간색|차|오늘|어제|그저께|그제|에|에서|을|를|정비|정비비|비용|금액|지출|수리비)(?=\s|$)/g," ");
  db.cars.forEach(c=>{if(c.nick)s=s.split(c.nick).join(" ")});
  return s.replace(/\s+/g," ").trim()||"정비";
}
function answer(p){
  const c=p.car,t=p.t,name=c.nick;
  if(/아낀|절약|연료|기름|휘발유|전기료/.test(t)){const fc=fuelCalc(c);return fc?`${name}: ${c.fuel.comp} 대비 지금까지 약 ${won(fc.save)} 아꼈어요.\n(휘발유 환산 ${won(fc.gas)} − 전기료 환산 ${won(fc.ev)}, ${num(fc.km)}km 기준)`:`${name}은(는) 아직 누적 km가 없어요. "${name} 205,500km"처럼 먼저 알려 주세요.`}
  if(/타이어/.test(t)){const rows=c.tires.map(x=>{const s=tireStats(c,x.id);return`· ${x.brand}: ${!s.count?"장착 이력 없음":s.unknown?"주행거리 입력 필요":num(s.dist)+"km"}${s.mounted?" (장착 중)":""}`});return`${name} 타이어 누적 주행\n`+(rows.join("\n")||"등록된 타이어가 없어요.")}
  if(/정비|수리/.test(t)){const tot=c.maint.reduce((s,m)=>s+(+m.amount||0),0),l=[...c.maint].sort((a,b)=>b.date.localeCompare(a.date))[0];return c.maint.length?`${name} 정비 ${c.maint.length}건, 합계 ${won(tot)}.\n가장 최근: ${l.date} ${l.item} ${won(l.amount)}`:`${name}은(는) 아직 정비 기록이 없어요.`}
  if(/km|킬로|주행|누적|탔/.test(t)){const k=lastKm(c);return k===null?`${name}은(는) 아직 누적 km가 없어요.`:`${name} 현재 누적 ${num(k)}km (${lastOdo(c).date} 기준)`}
  return null;
}
function aiRun(raw){
  raw=raw.trim();if(!raw)return;
  const p=parseText(raw),out=$("#aout");pending=null;
  setTimeout(()=>out.scrollIntoView({block:"nearest",behavior:"smooth"}),50);
  const isMaint=p.won!=null;
  if(isMaint){
    pending={type:"maint",car:p.car,date:p.date,item:itemName(p),amount:p.won,km:p.km};
    out.innerHTML=`<div class="pend"><div class="k">${esc(p.car.nick)}${p.guessed?" (차를 말하지 않아 선택된 차)":""} · 정비 기록</div><div class="t" style="font-size:15px;font-weight:600">${esc(pending.item)} · ${won(pending.amount)}</div><div class="sub">${p.date}${p.km?" · "+num(p.km)+"km":""}</div><div class="acts"><button class="btn" data-act="acancel">취소</button><button class="btn pri" data-act="asave">저장</button></div></div>`;
    return;
  }
  if(p.km!=null&&!/몇|얼마/.test(p.t)){
    const mx=lastKm(p.car);
    pending={type:"odo",car:p.car,date:p.date,km:p.km};
    out.innerHTML=`<div class="pend"><div class="k">${esc(p.car.nick)}${p.guessed?" (차를 말하지 않아 선택된 차)":""} · 주행거리</div><div class="big">${num(p.km)} km</div><div class="sub">${p.date}</div>${mx!=null&&p.km<mx?`<div class="warn">직전 기록(${num(mx)}km)보다 작아요. 맞는지 확인해 주세요.</div>`:""}<div class="acts"><button class="btn" data-act="acancel">취소</button><button class="btn pri" data-act="asave">저장</button></div></div>`;
    return;
  }
  const a=answer(p);
  out.innerHTML=`<div class="msg">${esc(a||'잘 못 알아들었어요. 이렇게 말해 보세요.\n· "하양이 205,500km 탔어"\n· "빨강이 에어컨 필터 교체 48,000원"\n· "하양이 아낀 연료비는?"')}</div>`;
}
function aiSave(){
  if(!pending)return;const p=pending;
  if(p.type==="odo")p.car.odo.push({id:uid(),date:p.date,km:p.km});
  else p.car.maint.push({id:uid(),date:p.date,item:p.item,amount:p.amount,shop:"",km:p.km||"",memo:"AI 입력"});
  db.sel=p.car.id;save();
  $("#aout").innerHTML=`<div class="msg">저장했어요 ✔ ${esc(p.car.nick)} · ${p.type==="odo"?num(p.km)+"km":esc(p.item)+" "+won(p.amount)}</div>`;
  $("#atxt").value="";pending=null;render();
}

/* ---------- 동작 ---------- */
function resizeImg(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/im.width),cv=document.createElement("canvas");cv.width=im.width*s;cv.height=im.height*s;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL("image/jpeg",.8))};im.src=r.result};r.readAsDataURL(file)}
const carFields=c=>[{k:"nick",l:"애칭(이름)",v:c.nick},{k:"model",l:"차종",v:c.model},{k:"trim",l:"트림",v:c.trim},{k:"year",l:"연식",t:"number",v:c.year},{k:"color",l:"색상 이름",v:c.color},{k:"colorHex",l:"색상 코드(그림용)",t:"color",v:c.colorHex},{k:"wheel",l:"휠",v:c.wheel},{k:"delivered",l:"인도일",t:"date",v:c.delivered},{k:"tireSpec",l:"정품 타이어 규격",v:c.tireSpec},{k:"tireAlt",l:"호환 타이어 규격",v:c.tireAlt},{k:"startKm",l:"계산 시작 km (인도 시 주행거리)",t:"number",v:c.startKm}];
const applyCar=(c,o)=>Object.assign(c,o,{year:+o.year||c.year,startKm:+o.startKm||0,nick:o.nick||c.nick});

$("#title").onclick=()=>{view="home";render();scrollTo(0,0)};
$("#scrim").onclick=()=>aiClose();
$("#aform").onsubmit=e=>{e.preventDefault();aiRun($("#atxt").value)};
$("#mic").onclick=()=>{
  if(!SR)return;if(rec){stopRec();return}
  rec=new SR();rec.lang="ko-KR";rec.interimResults=true;rec.continuous=false;
  rec.onresult=e=>{const tx=[...e.results].map(r=>r[0].transcript).join(" ");$("#atxt").value=tx;if(e.results[e.results.length-1].isFinal)aiRun(tx)};
  rec.onend=()=>{rec=null;$("#mic").classList.remove("rec");$("#ast").textContent="눌러서 말해 보세요"};
  rec.onerror=()=>{rec=null;$("#mic").classList.remove("rec");$("#ast").textContent="마이크를 쓸 수 없어요. 글로 입력해 주세요"};
  $("#mic").classList.add("rec");$("#ast").textContent="듣고 있어요…";rec.start();
};

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,c=car();
  if(a==="sel"){db.sel=id;save();render()}
  else if(a==="view"){view=id;render();scrollTo(0,0)}
  else if(a==="ai"){aiIsOpen?aiClose():aiOpen()}
  else if(a==="chip"){$("#atxt").value=b.textContent;aiRun(b.textContent)}
  else if(a==="asave")aiSave();
  else if(a==="acancel"){pending=null;$("#aout").innerHTML=""}
  else if(a==="mclose"){if(e.target===b||b.classList.contains("btn"))$("#modal").innerHTML=""}
  else if(a==="addOdoForm")form("주행거리 입력",[{k:"date",l:"날짜",t:"date",v:today()},{k:"km",l:"현재 누적 km",t:"number",p:"예: 205488"}],o=>{if(!+o.km||!o.date){alert("날짜와 누적 km를 입력해 주세요.");return false}const mx=lastKm(c);if(mx!=null&&+o.km<mx&&!confirm("직전 기록("+num(mx)+"km)보다 작습니다. 그래도 저장할까요?"))return false;c.odo.push({id:uid(),date:o.date,km:+o.km});save()});
  else if(a==="addOdo"){const km=+$("#odoKm").value,d=$("#odoDate").value;if(!km||!d)return alert("날짜와 누적 km를 입력해 주세요.");const mx=lastKm(c);if(mx!=null&&km<mx&&!confirm("직전 기록("+num(mx)+"km)보다 작습니다. 그래도 저장할까요?"))return;c.odo.push({id:uid(),date:d,km});save();render()}
  else if(a==="delOdo"){if(confirm("이 주행 기록을 삭제할까요?")){c.odo=c.odo.filter(o=>o.id!==id);save();render()}}
  else if(a==="editFuel"){
    form("계산 기준",[{k:"comp",l:"비교할 BMW 가솔린",t:"select",o:COMPS.map(x=>x[0]),v:c.fuel.comp},{k:"kmL",l:"휘발유 연비(km/L)",t:"number",v:c.fuel.kmL},{k:"price",l:"휘발유 가격(원/L)",t:"number",v:c.fuel.price},{k:"kmkWh",l:"테슬라 전비(km/kWh)",t:"number",v:c.fuel.kmkWh},{k:"kwh",l:"전기 단가(원/kWh)",t:"number",v:c.fuel.kwh}],o=>{c.fuel={comp:o.comp,kmL:+o.kmL||11,price:+o.price||1840,kmkWh:+o.kmkWh||5,kwh:+o.kwh||319};save()});
    const sel=document.querySelector('#modal [data-k="comp"]');sel.onchange=()=>{const x=COMPS.find(y=>y[0]===sel.value);if(x&&x[0]!=="직접 입력")document.querySelector('#modal [data-k="kmL"]').value=x[1]};
  }
  else if(a==="addMaint"||a==="editMaint"){const m=a==="editMaint"?c.maint.find(x=>x.id===id):{date:today(),item:"",amount:"",shop:"",km:"",memo:""};
    form(a==="addMaint"?"정비 기록 추가":"정비 기록 수정",[{k:"date",l:"날짜",t:"date",v:m.date},{k:"item",l:"정비 내용",v:m.item,p:"예: 에어컨 필터 교체"},{k:"amount",l:"금액(원)",t:"number",v:m.amount},{k:"shop",l:"정비소",v:m.shop},{k:"km",l:"그때 누적 km (선택)",t:"number",v:m.km},{k:"memo",l:"메모",t:"area",v:m.memo}],o=>{
      if(!o.item||!o.date){alert("날짜와 정비 내용을 입력해 주세요.");return false}
      if(a==="addMaint")c.maint.push({id:uid(),...o,amount:+o.amount||0});else Object.assign(m,o,{amount:+o.amount||0});save()})}
  else if(a==="delMaint"){if(confirm("이 정비 기록을 삭제할까요?")){c.maint=c.maint.filter(x=>x.id!==id);save();render()}}
  else if(a==="addTire"||a==="editTire"){const t=a==="editTire"?c.tires.find(x=>x.id===id):{brand:"",type:"사계절",size:c.tireSpec,bought:"",price:"",note:""};
    form(a==="addTire"?"타이어 세트 추가":"타이어 세트 수정",[{k:"brand",l:"타이어 (브랜드·모델)",v:t.brand},{k:"type",l:"종류",t:"select",o:["썸머","사계절","윈터","기본"],v:t.type},{k:"size",l:"규격",v:t.size},{k:"bought",l:"구입일",t:"date",v:t.bought},{k:"price",l:"구입가 (예: 90달러, 6,760원)",v:t.price},{k:"note",l:"메모",t:"area",v:t.note}],o=>{
      if(!o.brand){alert("타이어 이름을 입력해 주세요.");return false}
      if(a==="addTire")c.tires.push({id:uid(),...o});else Object.assign(t,o);save()})}
  else if(a==="delTire"){if(confirm("이 타이어 세트와 장착 이력을 삭제할까요?")){c.tires=c.tires.filter(x=>x.id!==id);c.mounts=c.mounts.filter(m=>m.tireId!==id);save();render()}}
  else if(a==="mount"){const k=lastKm(c);
    form("타이어 장착",[{k:"date",l:"장착 날짜",t:"date",v:today()},{k:"km",l:"장착 시 누적 km",t:"number",v:k??"",p:"그때 계기판 km"}],o=>{
      if(o.km===""&&!confirm("km를 비워두면 누적 주행거리를 계산할 수 없습니다. 그래도 저장할까요?"))return false;
      c.mounts.push({id:uid(),tireId:id,date:o.date,km:o.km===""?null:+o.km});save()},
      `<div class="sub">${esc(c.tires.find(x=>x.id===id).brand)} 를 끼웠다고 기록합니다. 지금까지 달려 있던 타이어의 주행은 여기서 끝납니다.</div>`)}
  else if(a==="editMount"){const m=c.mounts.find(x=>x.id===id);form("장착 이력 수정",[{k:"date",l:"장착 날짜",t:"date",v:m.date},{k:"km",l:"장착 시 누적 km",t:"number",v:m.km??""}],o=>{m.date=o.date;m.km=o.km===""?null:+o.km;save()})}
  else if(a==="delMount"){if(confirm("이 장착 이력을 삭제할까요?")){c.mounts=c.mounts.filter(x=>x.id!==id);save();render()}}
  else if(a==="editCar")form("차량 정보 수정",carFields(c),o=>{applyCar(c,o);save()});
  else if(a==="addCar"){const n={id:uid(),nick:"새 차",model:"Tesla Model 3",trim:"",year:new Date().getFullYear(),color:"흰색",colorHex:"#f1f1f1",wheel:"",delivered:"",tireSpec:"",tireAlt:"",photo:"",startKm:0,fuel:fuelDef(),odo:[],maint:[],tires:[],mounts:[]};form("차량 추가",carFields(n),o=>{applyCar(n,o);db.cars.push(n);db.sel=n.id;view="home";save()})}
  else if(a==="delCar"){if(db.cars.length<2)return alert("마지막 차량은 삭제할 수 없습니다.");if(confirm("'"+c.nick+"' 의 모든 기록을 삭제할까요? 되돌릴 수 없습니다.")){db.cars=db.cars.filter(x=>x.id!==c.id);db.sel=db.cars[0].id;save();render()}}
  else if(a==="photo"){const f=$("#photoIn");f.onchange=()=>{if(f.files[0])resizeImg(f.files[0],d=>{c.photo=d;save();render()})};f.click()}
  else if(a==="export"){const u=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download=today().replace(/-/g,"")+"_차차차_백업.json";l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
  else if(a==="import"){const f=$("#impIn");f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.cars||!d.cars.length)throw 0;if(confirm("현재 기록을 이 백업으로 바꿉니다. 계속할까요?")){db=d;save();render()}}catch(x){alert("올바른 백업 파일이 아닙니다.")}};r.readAsText(f.files[0])};f.click()}
});
render();
</script>
</body>
</html>

<script>
/* v425(2026-11-18 프팀장 전달 사용자 지시): 다크 모드가 기본 — 첫 화면을 그리기 전에 적용. 설정 > 화면의 '다크 모드'로 켜고 끔(이 브라우저 shfc.theme + 내 설정 파일 theme, 신한FC m과 같은 값) */
(function () {
  var p = ''; try { p = localStorage.getItem('shfc.theme') || ''; } catch (e) { p = ''; } if (p !== 'light' && p !== 'dark') p = 'dark';
  window.shfcTheme = function (v) {
    if (v !== 'light' && v !== 'dark') v = 'dark';
    document.documentElement.setAttribute('data-theme', v);
    var tc = document.querySelectorAll('meta[name="theme-color"]');
    for (var j = 0; j < tc.length; j++) { var m = tc[j]; if (!m.dataset.media) m.dataset.media = m.getAttribute('media') || ''; var md = m.dataset.media; m.setAttribute('media', (v === 'dark' ? /dark/.test(md) : /light/.test(md)) ? 'all' : 'not all'); }
    return v;
  };
  window.shfcTheme(p);
})();
</script>
